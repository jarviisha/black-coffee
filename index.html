<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- %BRAND_*% are filled from src/config/brand.ts by the brand-html plugin -->
    <link rel="icon" type="image/svg+xml" href="%BRAND_FAVICON%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_NAME%</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("theme") || "{}")
        if ((t.state && t.state.theme) !== "light") {
          document.documentElement.classList.add("dark")
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
